<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>陶良策 - 简历访问</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 30px;
      text-align: center;
      color: #333;
      background: #f8f9fa;
    }
    .header {
      margin-bottom: 30px;
    }
    h1 {
      color: #1a1a1a;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      font-size: 18px;
      margin-top: 5px;
    }

    /* --- 修改重点在这里 --- */
    .instruction {
      background: #f0f8ff;
      border: 1px dashed #0066cc;
      padding: 15px 20px; /* 稍微增加内边距让呼吸感更好 */
      border-radius: 8px;

      /* 核心修改：改为 block 并限制宽度 */
      display: block;
      width: fit-content;       /* 宽度随内容自适应，不会撑满全屏 */
      max-width: 80%;           /* 防止在大屏幕上太宽 */
      margin: 0 auto 25px auto; /* 上下外边距：上0，下25px(拉开与按钮距离)，左右auto(居中) */

      font-size: 14px;
      color: #888;
      line-height: 1.6;
      text-align: left;         /* 保持内部文字左对齐 */
    }
    /* --------------------- */

    .redirect-btn {
      display: inline-block;
      padding: 16px 32px;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 500;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
      margin-bottom: 10px;
    }
    .redirect-btn:hover {
      background-color: #0052a3;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 102, 204, 0.3);
    }
    .redirect-btn:active {
      transform: translateY(0);
    }
    .note {
      margin-top: 25px; /* 增加顶部间距，远离按钮 */
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>陶良策</h1>
    <p class="subtitle">AI Agent 开发工程师</p>
  </div>

  <!-- 说明框 -->
  <div class="instruction">
    <span style="font-size: 20px; margin-right: 5px;">👇</span>
    <strong style="color: #555; font-size: 15px;">点击下方按钮查看简历</strong>
    <br>
  </div>

  <!-- 按钮 -->
  <a href="https://r.easycv.cn/taoliangce" class="redirect-btn">
    查看我的完整简历
  </a>

  <p class="note">点击后将在新窗口打开简历页面</p>

</body>
</html>
