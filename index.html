<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>陶良策 - 简历访问</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 30px;
      text-align: center;
      color: #333;
      background: #f8f9fa;
    }
    .header {
      margin-bottom: 30px;
    }
    h1 {
      color: #1a1a1a;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      font-size: 18px;
      margin-top: 5px;
    }
    .instruction {
      background: #e9f5ff;
      border-left: 4px solid #0066cc;
      padding: 15px 20px;
      border-radius: 0 4px 4px 0;
      text-align: left;
      margin: 25px 0;
      font-size: 16px;
      line-height: 1.5;
    }
    .redirect-btn {
      display: inline-block;
      padding: 16px 32px;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 500;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
      margin: 10px 0;
    }
    .redirect-btn:hover {
      background-color: #0052a3;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 102, 204, 0.3);
    }
    .redirect-btn:active {
      transform: translateY(0);
    }
    .note {
      margin-top: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>陶良策</h1>
    <p class="subtitle">AI Agent 开发工程师</p>
  </div>
  
  <!-- 添加的说明文字 -->
  <div class="instruction">
    <strong>点击跳转到简历页面</strong>
    <br>您将访问我的最新在线简历（HTML格式）
  </div>
  
  <!-- 替换 href 为你的简历页面网址 -->
  <a href="https://r.easycv.cn/taoliangce" class="redirect-btn">
    查看我的完整简历
  </a>
  
  <p class="note">点击后将在新窗口打开简历页面</p>

  <script>
    // 可选：5秒后自动跳转（如需禁用请删除此代码块）
    setTimeout(() => {
      window.location.href = document.querySelector('.redirect-btn').href;
    }, 5000);
  </script>
</body>
</html>
