<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>陶良策 - 简历访问</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 80px auto;
      padding: 30px;
      text-align: center;
      color: #333;
      background: #f8f9fa;
    }
    .header {
      margin-bottom: 30px;
    }
    h1 {
      color: #1a1a1a;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      font-size: 18px;
      margin-top: 5px;
    }
    /* 修改说明框样式：更轻量、更圆润 */
    .instruction {
      /* 调浅背景色，减少视觉干扰 */
      background: #f0f8ff;
      border: 1px dashed #0066cc; /* 改为虚线边框，更柔和 */
      padding: 12px 15px;
      border-radius: 8px;
      display: inline-block; /* 收缩容器宽度 */
      margin: 20px auto; /* 居中 */
      font-size: 14px; /* 减小字体 */
      color: #888; /* 文字淡化 */
      line-height: 1.6;
    }
    .redirect-btn {
      display: inline-block;
      padding: 16px 32px;
      background-color: #0066cc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 500;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(0, 102, 204, 0.2);
      margin: 10px 0;
    }
    .redirect-btn:hover {
      background-color: #0052a3;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 102, 204, 0.3);
    }
    .redirect-btn:active {
      transform: translateY(0);
    }
    .note {
      margin-top: 25px;
      color: #aaa; /* 底部说明也淡化 */
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>陶良策</h1>
    <p class="subtitle">AI Agent 开发工程师</p>
  </div>
  
  <!-- 修改后的说明文字 -->
  <div class="instruction">
    <!-- 使用大号手指图标和箭头组合，形成强视觉引导 -->
    <span style="font-size: 24px; margin-right: 8px;">👇</span> 
    <strong style="color: #555; font-size: 15px;">点击下方按钮查看简历</strong>
    <br>
    <span style="color: #999;">👉 您的最新在线简历（HTML格式）</span>
  </div>
  
  <!-- 请务必替换 href 为你的真实简历网址 -->
  <a href="https://r.easycv.cn/taoliangce" class="redirect-btn">
    查看我的完整简历
  </a>
  
  <p class="note">点击后将在新窗口打开简历页面</p>

  <!-- 5秒自动跳转功能已移除 -->
</body>
</html>
